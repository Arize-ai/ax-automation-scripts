services:
  proxy:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Target: the customer's LLM gateway URL (required)
      TARGET_BASE_URL: ${TARGET_BASE_URL:-}

      # Auth type for upstream token acquisition: oauth2 | azure | static | none
      AUTH_TYPE: ${AUTH_TYPE:-none}

      # Optional: require Arize to send this token to authenticate to the proxy
      PROXY_AUTH_TOKEN: ${PROXY_AUTH_TOKEN:-}

      # --- OAuth2 (AUTH_TYPE=oauth2) ---
      OAUTH2_TOKEN_URL: ${OAUTH2_TOKEN_URL:-}
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID:-}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:-}
      OAUTH2_SCOPE: ${OAUTH2_SCOPE:-}

      # --- Azure (AUTH_TYPE=azure) ---
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_SCOPE: ${AZURE_SCOPE:-}

      # --- Static (AUTH_TYPE=static) ---
      STATIC_BEARER_TOKEN: ${STATIC_BEARER_TOKEN:-}

      # --- TLS / mTLS ---
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-}
      CLIENT_CERT_PATH: ${CLIENT_CERT_PATH:-}
      CLIENT_KEY_PATH: ${CLIENT_KEY_PATH:-}

      # --- Server ---
      PORT: ${PORT:-8000}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${CERTS_DIR:-./certs}:/app/certs:ro
    restart: unless-stopped
